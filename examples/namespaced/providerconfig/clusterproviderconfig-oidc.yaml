apiVersion: azapi.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default-oidc
spec:
  credentials:
    source: OIDCTokenFile
  tenantID: "00000000-0000-0000-0000-000000000000"
  clientID: "11111111-1111-1111-1111-111111111111"
  # oidcTokenFilePath defaults to /var/run/secrets/azure/tokens/azure-identity-token,
  # the path the Azure Workload Identity mutating webhook projects the
  # federated token to. Override only if using a non-default projected
  # volume mount path.
